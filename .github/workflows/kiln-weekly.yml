name: Kiln Locator weekly crawl

# Every Monday 8am Pacific (15:00 UTC; 7am in winter). Also runnable by hand from the Actions tab.
# Since 2026-11-23 results publish themselves: if kiln-map/check-publish.mjs passes, the new data is committed to main and
# deployed. If the check fails, the old behaviour applies (a review pull request, nothing goes live).
# Robby's rules (kiln-map/triage.mjs) decide what is public; items still needing judgement wait in kiln-map/REVIEW.md.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency: kiln-weekly

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Crawl websites, the newsletter inbox and Instagram; new or changed items land in kiln-map/data/pending/.
      - name: Crawl and extract
        run: npm run kiln:extract
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KILN_INBOX_TOKEN: ${{ secrets.KILN_INBOX_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      # Apply Robby's standing listing rules (reject past/non-firing, approve clear items, mark full) so the review list stays short.
      - name: Apply listing rules
        run: node kiln-map/triage.mjs --apply

      # Rebuild page data from APPROVED items only (drops past firings, hides dead links).
      - name: Build page data
        run: npm run kiln:build

      - name: Write review list
        run: npm run kiln:review

      - name: Safety check before publishing
        id: check
        continue-on-error: true
        run: node kiln-map/check-publish.mjs

      - name: Publish to main and deploy (check passed)
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kiln-weekly"
          git config user.email "actions@users.noreply.github.com"
          git add kiln-map/data kiln-map/REVIEW.md site/data/firings.json
          if git diff --cached --quiet; then echo "Nothing changed this week."; exit 0; fi
          git commit -m "Weekly kiln crawl $(date -u +%F) (auto-published)"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with the default token does not start the deploy workflow, so start it directly.
          gh workflow run deploy.yml --ref main

      - name: Open review pull request (check failed)
        if: steps.check.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kiln-weekly"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="kiln-weekly/$(date -u +%F)"
          git checkout -b "$BRANCH"
          git add kiln-map/data kiln-map/REVIEW.md site/data/firings.json
          if git diff --cached --quiet; then echo "Nothing changed this week."; exit 0; fi
          git commit -m "Weekly kiln crawl $(date -u +%F) (held: publish check failed)"
          git push -u origin "$BRANCH"
          head -c 60000 kiln-map/REVIEW.md > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" --title "Kiln Locator HELD $(date -u +%F): publish check failed" --body-file /tmp/pr-body.md
