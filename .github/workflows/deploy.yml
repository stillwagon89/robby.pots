name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Cloudflare's zone Browser Cache TTL makes browsers keep styles.css and
      # gallery.js for 4 hours regardless of site/_headers, so a returning
      # visitor could run old JS against new HTML. HTML always revalidates, so
      # stamping each deploy's commit into these URLs makes browsers fetch the
      # new copies right away.
      - name: Version asset URLs
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/*.html
      - name: Deploy via Wrangler
        run: npx wrangler@4 pages deploy site --project-name=robbypots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
