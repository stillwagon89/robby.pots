<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robby Stillwagon - Ceramics & Commissions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #333;
      background-image: url('glaze-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    nav .links a { color: #333; background: rgba(255,255,255,0.85); text-decoration: none; margin-left: 12px; font-size: 0.95rem; padding: 8px 14px; border-radius: 20px; }
    nav .links a:hover { background: #fff; }

    header { text-align: center; margin-bottom: 40px; background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px 20px; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .tagline { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
    .cta { background: #2c2c2c; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
    .cta:hover { background: #1a1a1a; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; margin: 0 0 40px; }
    .piece { background: rgba(255,255,255,0.95); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .piece-image { width: 100%; height: 250px; background: #ddd; border-radius: 4px; margin-bottom: 15px; display: block; object-fit: cover; }
    .piece h3 { margin-bottom: 8px; }
    .piece p { color: #666; font-size: 0.9rem; }

    footer { text-align: center; color: #333; margin-top: 40px; padding: 20px; background: rgba(255,255,255,0.85); border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <img src="logo.jpg" alt="Robby Stillwagon" class="logo">
      <div class="links">
        <a href="index.html">Home</a>
        <a href="ask.html">Ask</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>

    <header>
      <h1>Robby Stillwagon</h1>
      <p class="tagline">Ceramics & Custom Commissions</p>
      <a href="contact.html" class="cta">Request a Commission</a>
    </header>

    <section class="gallery" id="gallery">
      <div class="piece">
        <img src="moon-jar.jpg" alt="Moon Jar" class="piece-image">
        <h3>Moon Jar</h3>
        <p>Stoneware, celadon glaze with iron-oxide rim</p>
      </div>
      <div class="piece">
        <img src="mug2.png" alt="Matching Mug Set" class="piece-image">
        <h3>Matching Mug Set</h3>
        <p>Stoneware, glossy speckled glaze</p>
      </div>
      <div class="piece">
        <img src="teapot.jpg" alt="Gas-fired Teapot" class="piece-image">
        <h3>Gas-fired Teapot</h3>
        <p>Stoneware, ash glaze with iron slip</p>
      </div>
    </section>

    <footer>
      <p>Based in San Francisco</p>
    </footer>
  </div>
</body>
</html>
