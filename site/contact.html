<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Robby Stillwagon Ceramics</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@variable&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="moonjar-bg" aria-hidden="true">
    <img src="moon-jar.jpg" alt="" class="moonjar-bg-img">
    <div class="moonjar-bg-wash"></div>
  </div>

  <div class="container moonjar-content">
    <a href="index.html" class="wordmark-lockup" aria-label="Still Wagon Ceramics — home">
      <span class="wordmark-line">STILL<img src="assets/logo-mark-cobalt.svg" alt="" class="wordmark-mark"></span>
      <span class="wordmark-line">WAGON</span>
    </a>
    <nav class="site-nav-v3">
      <a href="gallery.html">Ceramics</a>
      <a href="ask.html">Ask</a>
      <a href="contact.html">Contact</a>
      <a href="https://instagram.com/robby.pots" target="_blank" rel="noopener">Instagram</a>
    </nav>

    <div class="contact-header">
      <h1>Get in Touch</h1>
      <p class="tagline">Commission inquiries, questions, or just say hello</p>
    </div>

    <section class="card contact-card">
      <h2>Commission Inquiry</h2>
      <p class="hint">Tell me a bit about what you're picturing — piece type, size, color/glaze ideas, and rough timeline. I'll follow up with pricing and turnaround.</p>
      <form id="contact-form">
        <div class="field">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="description">What would you like commissioned?</label>
          <textarea id="description" name="description" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-cta" id="submit-btn">Send Inquiry</button>
        <div class="status" id="form-status"></div>
      </form>
    </section>
  </div>

  <main></main>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.className = 'status';
      status.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const response = await fetch('/api/contact', {
          method: 'POST',
          body: new FormData(form),
        });

        if (response.ok) {
          status.className = 'status success';
          status.textContent = "Thanks! Your inquiry has been sent — I'll get back to you soon.";
          form.reset();
        } else {
          const data = await response.json().catch(() => ({}));
          status.className = 'status error';
          status.textContent = data.error || 'Something went wrong. Please try again or email me directly.';
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Network error — please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Inquiry';
      }
    });
  </script>
</body>
</html>
