<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Flaming Clay Ceramics</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@variable&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="moonjar-bg" aria-hidden="true">
    <img src="moon-jar.jpg" alt="" class="moonjar-bg-img">
    <div class="moonjar-bg-wash"></div>
  </div>

  <div class="container page-shell">
    <aside class="sidebar">
      <a href="index.html" class="wordmark-lockup" aria-label="Flaming Clay — home">
        <span class="wordmark-line">FLAMING</span>
        <span class="wordmark-line">CLAY<img src="assets/flame-mark.png" alt="" class="flame-mark"></span>
      </a>
      <nav class="site-nav-v3">
        <a href="gallery.html">Ceramics</a>
        <a href="ask.html">Clay.AI</a>
        <a href="contact.html">Contact</a>
        <a href="bio.html">Bio</a>
        <a href="https://instagram.com/robby.pots" target="_blank" rel="noopener" class="nav-ig" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        </a>
      </nav>
    </aside>

    <main class="page-content">
      <div class="contact-header">
      <h1>Get in Touch</h1>
      <p class="tagline">Commission inquiries, questions, or just say hello</p>
    </div>

    <section class="card contact-card">
      <h2>What's on your mind?</h2>
      <p class="hint">Tell me a bit about what you're picturing. Are we working together on this piece? What materials interest you?</p>
      <form id="contact-form">
        <div class="field">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="description">What would you like commissioned?</label>
          <textarea id="description" name="description" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-cta" id="submit-btn">Send Inquiry</button>
        <div class="status" id="form-status"></div>
      </form>
    </section>
    </main>
  </div>

  <footer class="site-footer">San Francisco</footer>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.className = 'status';
      status.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const response = await fetch('/api/contact', {
          method: 'POST',
          body: new FormData(form),
        });

        if (response.ok) {
          status.className = 'status success';
          status.textContent = "Thanks! Your inquiry has been sent — I'll get back to you soon.";
          form.reset();
        } else {
          const data = await response.json().catch(() => ({}));
          status.className = 'status error';
          status.textContent = data.error || 'Something went wrong. Please try again or email me directly.';
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Network error — please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Inquiry';
      }
    });
  </script>
</body>
</html>
