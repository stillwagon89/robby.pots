</head>
<body>

  <div class="moonjar-bg moonjar-bg--full" aria-hidden="true">
    <img src="/cdn-cgi/image/width=1200,quality=70,format=auto,onerror=redirect/moon-jar.jpg" srcset="/cdn-cgi/image/width=800,quality=70,format=auto,onerror=redirect/moon-jar.jpg 800w, /cdn-cgi/image/width=1200,quality=70,format=auto,onerror=redirect/moon-jar.jpg 1200w, /cdn-cgi/image/width=1600,quality=70,format=auto,onerror=redirect/moon-jar.jpg 1600w" sizes="100vw" fetchpriority="low" onerror="this.onerror=null;this.removeAttribute('srcset');this.src='moon-jar.jpg'" alt="" class="moonjar-bg-img">
    <div class="moonjar-bg-wash"></div>
  </div>

  <div class="container page-shell">
    <aside class="sidebar">
      <a href="index.html" class="wordmark-lockup" aria-label="Flaming Clay — home">
        <span class="wordmark-line">FLAMING</span>
        <span class="wordmark-line">CLAY<img src="assets/flame-mark.png" alt="" class="flame-mark"></span>
      </a>
      <nav class="site-nav-v3">
        <a href="gallery.html">Shop</a>
        <a href="folsom.html">Folsom<span class="nav-long"> Collection</span></a>

        <a href="https://www.instagram.com/flaming.clay/" target="_blank" rel="noopener" class="nav-ig" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        </a>
      </nav>
    </aside>

    <main class="page-content">

    <section class="hero-fullscreen" aria-hidden="true"></section>

    <section class="signup-strip">
      <p>If you're interested in receiving updates first, please leave your email below.</p>
      <form id="waitlistForm" class="waitlist-form">
        <input type="email" placeholder="your@email.com" required aria-label="Email address">
        <button type="submit">Notify Me</button>
      </form>
      <p id="formMessage" class="form-message"></p>
    </section>

    </main>
  </div>

  <footer class="site-footer">San Francisco</footer>

  <script>
    function setupWaitlistForm() {
      const form = document.getElementById('waitlistForm');
      const messageEl = document.getElementById('formMessage');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = form.querySelector('input[type="email"]').value;
        const button = form.querySelector('button');

        button.disabled = true;
        messageEl.textContent = '';
        messageEl.className = '';

        try {
          const response = await fetch('/api/waitlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          if (response.ok) {
            messageEl.textContent = data.message;
            messageEl.className = 'form-message success';
            form.reset();
          } else {
            messageEl.textContent = data.error || 'Something went wrong.';
            messageEl.className = 'form-message error';
          }
        } catch (err) {
          console.error('Waitlist signup error:', err);
          messageEl.textContent = 'Failed to sign up. Please try again.';
          messageEl.className = 'form-message error';
        } finally {
          button.disabled = false;
        }
      });
    }

    setupWaitlistForm();
  </script>

</body>
</html>
